<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="leaflet/leaflet.css">
<link rel="stylesheet" href="atlas.css">
</head>
<body>
<div id="map"></div>
<aside id="panel">
  <header><img src="icon.png" alt=""><h1 id="title">{{title}}</h1><button id="fold" title="Hide or show">–</button></header>
  <div id="body">
    <label class="row">World <select id="dim"></select></label>
    <div id="layers"></div>
    <div id="status"></div>
  </div>
</aside>
<div id="legend"></div>
<div id="coords"></div>
<div id="meter" hidden></div>
<script src="leaflet/leaflet.js"></script>
<script src="atlas.js"></script>
</body>
</html>

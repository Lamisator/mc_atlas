plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// optional: overlays for these mods are switched on only when they are installed
	compileOnly files("libs/gridworks-1.1.2.jar", "libs/radiation-1.4.0.jar", "libs/hamradio-1.6.2.jar")

	// running a server on a saved world that needs more mods: -PmapMods=/path/a.jar,/path/b.jar
	if (project.hasProperty("mapMods")) {
		localRuntime files(project.property("mapMods").toString().split(","))
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "LICENSE_atlas" }
	}
}
